$def with (addcountry, listcountries)
<div id="container">
<div id="default">
<br>
<h2>Add shipping country</h2>
<div id="addevent">
<form method="POST">
$:addcountry.render()
</form>
</div>
$for i in listcountries:
    <a href='/shipping/$i.id'>$i.country $i.price $i.days</a>
<b><p></p></b>
</div>
</div>
</div>
